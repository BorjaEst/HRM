[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-sn"
version = "0.1.0"
description = "Hierarchical Reasoning Model for Spatial Navigation (HRM-SN): package + experiment scaffolding."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "torch",
    "lightning",
    "hydra-core",
    "omegaconf",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "tqdm",
    "einops",
    "pyyaml",
    "huggingface_hub",
    "tensorboard",
    "matplotlib",
    "SciencePlots",
    "pub-ready-plots",
]

[project.optional-dependencies]
dev = ["pytest~=8.4.0", "black~=25.9.0", "flake8~=7.3.0", "mypy~=1.18.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Keep configs within the package if you later move Hydra configs under src/hrm_sn/
# (e.g., src/hrm_sn/config/**)
hrm_sn = ["py.typed", "**/*.yaml", "**/*.yml"]

[tool.isort]
profile = "black"
line_length = 105
known_first_party = ["hrm_sn"]

[tool.black]
line-length = 105
target-version = ["py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
