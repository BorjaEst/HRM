# Default configuration for training the hierarchical reasoning model with ACT
arch:
  halt_exploration_prob: 0.1
  halt_max_steps: 16

  H_cycles: 2
  L_cycles: 2

  H_layers: 4
  L_layers: 4

  hidden_size: 512
  num_heads: 8 # min(2, hidden_size // 64)
  expansion: 4

  puzzle_emb_ndim: ${.hidden_size}

  pos_encodings: rope

hydra:
  output_subdir: null

# Data path
data_path: data/maze-30x30-hard-1k

# Loss config
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

# Hyperparams - Training
global_batch_size: 768

epochs: 100000
eval_interval: 10000
checkpoint_every_eval: True

# Optimizers (embeddings and main model parameters)
optim_emb:
  lr: 1e-2
  weight_decay: 0.1
optim_main:
  lr: 1e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95

# Scheduler config
scheduler:
  warmup_steps: 2000
  min_ratio: 1.0 #

# --------- OLD CONFIG KEPT FOR REFERENCE, TO BE REMOVED ---------

# Optimizer 1 - Puzzle embeddings training
emb_lr: 1e-2
emb_weight_decay: 0.1

# Optimizer 2 - AdamATan2 for model parameters
lr: 1e-4
lr_min_ratio: 1.0 # TODO: configure lightning to use this
lr_warmup_steps: 2000 # TODO: configure lightning to use this

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
